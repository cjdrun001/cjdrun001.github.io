const grid=document.getElementById('card-grid');
const modal=document.getElementById('video-modal');
const modalTitle=document.getElementById('modal-title');
const modalClose=document.getElementById('modal-close');
const player=document.getElementById('video-player');
let lastTrigger=null;
function closePlayer(){
 if(modal.getAttribute('aria-hidden')==='true')return;
 modal.setAttribute('aria-hidden','true');
 player.src='about:blank';
 document.body.style.overflow='';
 if(lastTrigger)lastTrigger.focus();
}
function openPlayer(video,trigger){
 lastTrigger=trigger;
 modalTitle.textContent=video.title;
 player.title=video.title;
 const originParam=(location.protocol==='https:'||location.protocol==='http:')?`&origin=${encodeURIComponent(location.origin)}`:'';
 player.src=`https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0&playsinline=1${originParam}`;
 modal.setAttribute('aria-hidden','false');
 document.body.style.overflow='hidden';
 modalClose.focus();
}
modalClose.addEventListener('click',closePlayer);
modal.querySelector('[data-modal-close]').addEventListener('click',closePlayer);
document.addEventListener('keydown',event=>{if(event.key==='Escape')closePlayer();});
for(let i=0;i<36;i++){
 const card=document.createElement('article');
 card.className='card';
 const video=videos[i];
 if(video){
  card.classList.add('video-card');
  const button=document.createElement('button');
  button.className='video-card-button';
  button.type='button';
  button.setAttribute('aria-label',video.title);
  button.addEventListener('click',()=>openPlayer(video,button));
  const thumb=document.createElement('span');
  thumb.className=`thumb t${(i%6)+1}`;
  const image=document.createElement('img');
  image.className='video-thumb';
  image.src=video.thumbnail;
  image.alt='';
  image.loading='lazy';
  const body=document.createElement('span');
  body.className='card-body video-card-body';
  const title=document.createElement('span');
  title.className='video-title';
  title.textContent=video.title;
  thumb.appendChild(image);
  body.appendChild(title);
  button.append(thumb,body);
  card.appendChild(button);
 }else{
  card.innerHTML=`<div class="thumb t${(i%6)+1}" aria-hidden="true"><div class="thumb-art"></div></div><div class="card-body"><div class="title-placeholder" aria-hidden="true"></div><div class="title-placeholder short" aria-hidden="true"></div><div class="desc-placeholder" aria-hidden="true"></div><div class="desc-placeholder short" aria-hidden="true"></div></div>`;
 }
 grid.appendChild(card);
}
</script>
