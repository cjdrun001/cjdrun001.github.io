    { id: 'M16', tag: '문서 작성', difficulty: 'AI 이해하기', title: '문서·문항 검수기록 읽기', url: 'https://www.youtube.com/watch?v=MP_ReB0Vn50' },
    { id: 'M17', tag: '영상 생성', difficulty: 'AI 심화과정', title: '스토리보드와 영상 소재 확인', url: 'https://www.youtube.com/watch?v=1fZqBgSuMrU' },
    { id: 'M18', tag: '문서 작성', difficulty: 'AI 심화과정', title: '최종 작품 공유 전 점검', url: 'https://www.youtube.com/watch?v=KK9Br0h3dwE' },
    { id: 'M19', tag: '바이브코딩', difficulty: 'AI 이해하기', title: '내가 반복했던 일 찾아내기', url: 'https://www.youtube.com/watch?v=kaoezDjBMoo' },
    { id: 'M20', tag: '바이브코딩', difficulty: 'AI 이해하기', title: '자연어로 웹앱 요구사항 설계하기', url: 'https://www.youtube.com/watch?v=yzhOlS7OAPQ' },
    { id: 'M21', tag: '바이브코딩', difficulty: 'AI 시작하기', title: '내 웹앱 첫 화면 구성 다시 보기', url: 'https://www.youtube.com/watch?v=aSFrTF1aYKc' },
    { id: 'M22', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '기존 앱을 유지하며 기능 요청하기', url: 'https://www.youtube.com/watch?v=5DKbjNVDRz0' },
    { id: 'M23', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '키워드 분류의 정상·예외 입력 복습', url: 'https://www.youtube.com/watch?v=Xa24cdR-LnA' },
    { id: 'M24', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '브라우저 저장과 새로고침 확인', url: 'https://www.youtube.com/watch?v=c-NSGD0ze_0' },
    { id: 'M25', tag: '바이브코딩', difficulty: 'AI 심화과정', title: 'AI 요약을 추가해도 기존 기능 지키기', url: 'https://www.youtube.com/watch?v=7IK6wq5QzOs' },
    { id: 'M26', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '다른 사용자 관점에서 웹앱 사용 흐름 확인', url: 'https://www.youtube.com/watch?v=sjRYinIKsWQ' },
    { id: 'M27', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '진짜 AI 결과·예시·오류 구분', url: 'https://www.youtube.com/watch?v=XGKY9jkbH_g' },
    { id: 'M28', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '버그 재현과 회귀 검사', url: 'https://www.youtube.com/watch?v=5JU379DrPbk' },
    { id: 'M29', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '반복작업을 작은 Task로 바꾸기', url: 'https://www.youtube.com/watch?v=nkwlgsZQsl4' },
    { id: 'M30', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '자동화할 자료와 사람 검토 기준 정하기', url: 'https://www.youtube.com/watch?v=lkjH8TokyuA' },
    { id: 'M31', tag: '바이브코딩', difficulty: 'AI 심화과정', title: 'Tasks·Skills·Schedules 다시 구분하기', url: 'https://www.youtube.com/watch?v=bUGIehyMrmE' },
    { id: 'M32', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '단건 실행·예외·예약을 구분하기', url: 'https://www.youtube.com/watch?v=quR-uigu9P8' },
    { id: 'M33', tag: 'AI 일반', difficulty: 'AI 이해하기', title: '변화카드에서 근거 검증까지의 성장 기록', url: 'https://www.youtube.com/watch?v=OZ6G0Ndrvx8' },
    { id: 'M34', tag: '영상 생성', difficulty: 'AI 심화과정', title: '대표 작품과 나의 기여 이야기하기', url: 'https://www.youtube.com/watch?v=fYh--NLCuck' },
    { id: 'M35', tag: '바이브코딩', difficulty: 'AI 심화과정', title: '웹앱·자동화 성취를 근거로 설명하기', url: 'https://www.youtube.com/watch?v=qAIfRvwHl5M' },
    { id: 'M36', tag: 'AI 일반', difficulty: 'AI 이해하기', title: '작품 공유의 개인정보·권리 최종 확인', url: 'https://www.youtube.com/watch?v=1HHvuiM0wFU' }
  ];

  function parseVideoId(url) {
    if (!url || typeof url !== 'string') return null;
    const trimmed = url.trim();
    if (!trimmed) return null;
    const regExp = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = trimmed.match(regExp);
    if (match && match[1]) return match[1];
    if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
    return null;
  }

  function sendLog(actionType, targetTitle) {
    const userEmail = localStorage.getItem('user_email') || '미입력';
    const payload = {
      name: userEmail,
      action: actionType,
      target: targetTitle || null,
      clientTime: new Date().toISOString()
    };

    if (WORKER_ENDPOINT) {
      fetch(WORKER_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(() => {});
    }
  }

  const userBadgeBtn = document.getElementById('userBadgeBtn');
  const userBadgeText = document.getElementById('userBadgeText');
  const nameModal = document.getElementById('nameModal');
  const nameModalShade = document.getElementById('nameModalShade');
  const nameModalHeading = document.getElementById('nameModalHeading');
  const userNameInput = document.getElementById('userNameInput');
  const nameSaveBtn = document.getElementById('nameSaveBtn');
  const nameCancelBtn = document.getElementById('nameCancelBtn');

  function updateBadgeText(email) {
    userBadgeText.textContent = `${email}님 환영합니다!`;
  }

  function openEmailModal(isEditMode) {
    nameModalHeading.textContent = isEditMode ? '이메일(구글 계정) 변경' : '로그인 (이메일 입력)';
    userNameInput.value = localStorage.getItem('user_email') || '';
    nameCancelBtn.style.display = isEditMode ? 'inline-block' : 'none';
    nameModal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(() => userNameInput.focus(), 50);
  }

  function closeEmailModal() {
    nameModal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function handleEmailSubmit() {
    const inputVal = userNameInput.value.trim();
    if (!inputVal) {
      alert('이메일(구글 계정)을 입력해 주세요.');
      userNameInput.focus();
      return;
    }

    const emailKey = inputVal.toLowerCase();
    const isFirstTime = !localStorage.getItem('user_email');

    // 엑셀 설문조사 데이터(이메일 매칭) 확인
    const recommendedDiff = SURVEY_USERS[emailKey];
    const targetDiff = recommendedDiff || 'all';

    localStorage.setItem('user_email', inputVal);
    localStorage.setItem('user_diff_tag', targetDiff);
    localStorage.removeItem('user_name'); // 기존 이름 정보 완전 삭제

    updateBadgeText(inputVal);
    closeEmailModal();

    // 'B영역_자가평가지원그룹' 항목에 따라서 난이도 분류 태그 기본 선택
    setDifficultyFilter(targetDiff);

    // 첫 로그인 시, 구글 계정과 매칭되는 경우 팝업 출력
    const welcomedKey = 'welcomed_' + emailKey;
    const alreadyWelcomed = localStorage.getItem(welcomedKey);

    if (recommendedDiff && !alreadyWelcomed) {
      localStorage.setItem(welcomedKey, 'true');
      setTimeout(() => {
        alert('어서 오세요! 수강 전 설문조사 결과를 참고해서 추천 강의를 보여드릴게요. 다른 강의를 보고 싶을 때는 오른쪽 메뉴를 활용해 주세요!');
      }, 100);
    }

    if (isFirstTime) {
      sendLog('접속', null);
    }
  }

  nameSaveBtn.addEventListener('click', handleEmailSubmit);
  userNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleEmailSubmit();
    if (e.key === 'Escape' && localStorage.getItem('user_email')) closeEmailModal();
  });
  nameCancelBtn.addEventListener('click', () => {
    if (localStorage.getItem('user_email')) closeEmailModal();
  });
  nameModalShade.addEventListener('click', () => {
    if (localStorage.getItem('user_email')) closeEmailModal();
  });
  userBadgeBtn.addEventListener('click', () => openEmailModal(true));

  const videoGrid = document.getElementById('videoGrid');
  const diffButtons = document.querySelectorAll('.diff-btn');
  const categorySelect = document.getElementById('categorySelect');
  const modal = document.getElementById('videoModal');
  const modalShade = document.getElementById('modalShade');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const modalTitle = document.getElementById('modalVideoTitle');
  const playerFrame = document.getElementById('playerFrame');

  let currentCategory = 'all';
  let currentDifficulty = 'all';

  function renderCards() {
    videoGrid.innerHTML = '';

    const filtered = VIDEO_ITEMS.filter(item => {
      // 1. 주제 분류 필터 (드롭다운)
      const matchCat = (currentCategory === 'all' || item.tag === currentCategory);

      // 2. 난이도 분류 필터:
      // 난이도 태그가 없는 강의는 선택과 관계 없이 함께 보이도록 설정
      if (!item.difficulty || !DIFFICULTY_LEVELS[item.difficulty]) {
        return matchCat;
      }

      // 난이도 전체 선택 시 모두 표시
      if (currentDifficulty === 'all') {
        return matchCat;
      }

      // 난이도 선택 시, 선택한 난이도 이상의 강의가 모두 보이도록 설정
      const selectedLevel = DIFFICULTY_LEVELS[currentDifficulty] || 1;
      const itemLevel = DIFFICULTY_LEVELS[item.difficulty] || 1;
      const matchDiff = (itemLevel >= selectedLevel);

      return matchCat && matchDiff;
    });

    // 정렬 로직:
    // 난이도 선택을 했을 때는 AI 시작하기, AI 이해하기, AI 심화과정 순서대로 정렬 (같은 난이도 내에서는 모듈 번호 순서대로)
    // 난이도 전체('all')일 때는 모듈 번호 순서대로 정렬
    filtered.sort((a, b) => {
      const numA = parseInt(a.id.replace(/\D/g, ''), 10) || 0;
      const numB = parseInt(b.id.replace(/\D/g, ''), 10) || 0;

      if (currentDifficulty !== 'all') {
        const levelA = DIFFICULTY_LEVELS[a.difficulty] || 999;
        const levelB = DIFFICULTY_LEVELS[b.difficulty] || 999;
        if (levelA !== levelB) {
          return levelA - levelB; // 1 ('AI 시작하기') -> 2 ('AI 이해하기') -> 3 ('AI 심화과정')
        }
      }
      return numA - numB; // 같은 난이도 내에서는 모듈 번호 순서대로
    });

    if (filtered.length === 0) {
      videoGrid.innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted);">
          <div style="font-size: 32px; margin-bottom: 12px;">🔍</div>
          <div style="font-size: 16px; font-weight: 700; color: var(--ink);">선택한 조건에 해당하는 강의가 없습니다.</div>
          <div style="font-size: 13px; margin-top: 6px;">오른쪽 메뉴에서 난이도나 주제 분류를 변경해 보세요.</div>
        </div>
      `;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';

      const videoId = parseVideoId(item.url);
      const isReady = Boolean(videoId);

      const thumbHtml = isReady
        ? `<div class="thumb">
             <div class="thumb-art" style="position:absolute;"><span style="font-size:24px;color:var(--ink);">${item.id}</span></div>
             <img class="video-thumb" src="https://i.ytimg.com/vi/${videoId}/hqdefault.jpg" alt="${item.title}" loading="lazy" onerror="this.style.display='none'">
           </div>`
        : `<div class="thumb">
             <div class="thumb-art"><span style="font-size:24px;color:var(--ink);">${item.id}</span></div>
           </div>`;

      const statusBadge = isReady
        ? `<span class="status ready">학습 가능</span>`
        : `<span class="status pending">업로드 대기</span>`;

      const diffBadgeHtml = item.difficulty
        ? `<span class="video-tag" data-diff="${item.difficulty}">[${item.difficulty}]</span>`
        : '';

      const tagsHtml = `
        <div class="video-tags">
          <span class="video-tag" data-cat="${item.tag}">[${item.tag}]</span>
          ${diffBadgeHtml}
        </div>
      `;

      const actionContent = isReady
        ? `<button type="button" class="video-card-button" data-lesson-id="${item.id}" data-video-id="${videoId}" data-title="${item.title}">
             ${thumbHtml}
             <div class="card-body">
               <div class="card-top">
                 ${statusBadge}
                 <span class="video-label">${item.id}</span>
               </div>
               <h3 class="video-title">${item.title}</h3>
               ${tagsHtml}
               <div class="card-bottom">
                 <span class="video-label">마이크로러닝</span>
                 <span class="video-link">시청하기 <span class="smallplay">▶</span></span>
               </div>
             </div>
           </button>`
        : `<div>
             ${thumbHtml}
             <div class="card-body">
               <div class="card-top">
                 ${statusBadge}
                 <span class="video-label">${item.id}</span>
               </div>
               <h3 class="video-title">${item.title}</h3>
               ${tagsHtml}
               <div class="card-bottom">
                 <span class="video-label">업로드 예정</span>
                 <span class="video-link disabled">준비중</span>
               </div>
             </div>
           </div>`;

      card.innerHTML = actionContent;
      videoGrid.appendChild(card);
    });

    document.querySelectorAll('.video-card-button').forEach(btn => {
      btn.addEventListener('click', () => {
        const lessonId = btn.getAttribute('data-lesson-id');
        const vId = btn.getAttribute('data-video-id');
        const vTitle = btn.getAttribute('data-title');
        sendLog('시청', lessonId);
        openPlayer(vId, vTitle, lessonId);
      });
    });
  }

  function setDifficultyFilter(diffValue) {
    currentDifficulty = diffValue;
    diffButtons.forEach(btn => {
      if (btn.getAttribute('data-diff') === diffValue) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    renderCards();
  }

  diffButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const diffVal = btn.getAttribute('data-diff');
      setDifficultyFilter(diffVal);
    });
  });

  if (categorySelect) {
    categorySelect.addEventListener('change', (e) => {
      currentCategory = e.target.value;
      renderCards();
    });
  }

  let currentWatchingLessonId = null;

  function openPlayer(videoId, title, lessonId) {
    currentWatchingLessonId = lessonId || null;
    modalTitle.textContent = title;
    playerFrame.title = title;
    playerFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closePlayer() {
    if (modal.getAttribute('aria-hidden') === 'false') {
      if (currentWatchingLessonId) {
        sendLog('종료', currentWatchingLessonId);
        currentWatchingLessonId = null;
      }
      playerFrame.src = '';
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
  }

  modalCloseBtn.addEventListener('click', closePlayer);
  modalShade.addEventListener('click', closePlayer);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (modal.getAttribute('aria-hidden') === 'false') closePlayer();
      if (nameModal.getAttribute('aria-hidden') === 'false' && localStorage.getItem('user_email')) closeEmailModal();
    }
  });

  window.addEventListener('pagehide', () => {
    if (currentWatchingLessonId) {
      sendLog('종료', currentWatchingLessonId);
      currentWatchingLessonId = null;
    } else if (localStorage.getItem('user_email')) {
      sendLog('종료', null);
    }
  });

  // 초기 로드 시 로그인 상태 및 추천 필터 복원
  const savedEmail = localStorage.getItem('user_email');
  if (savedEmail) {
    const emailKey = savedEmail.toLowerCase();
    const recommendedDiff = SURVEY_USERS[emailKey];
    const savedDiff = recommendedDiff || (localStorage.getItem('user_diff_tag') || 'all');

    updateBadgeText(savedEmail);
    setDifficultyFilter(savedDiff);
    sendLog('접속', null);
  } else {
    userBadgeText.textContent = '로그인해 주세요';
    setDifficultyFilter('all');
    openEmailModal(false);
  }
})();
</script>
