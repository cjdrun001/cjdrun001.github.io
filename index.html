<title>2026 생성형 AI 및 바이브 코딩 활용 연수 사전 학습 영상</title>
<style>
:root{--ink:#173b57;--ink2:#284d66;--teal:#31a7a0;--gold:#f4c95d;--paper:#f6f8fa;--white:#fff;--line:#e2e9ee;--muted:#6e7e89;--soft:#eaf4f5;--shadow:0 10px 32px rgba(23,59,87,.08);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:calc(100% - 48px);max-width:1680px;margin:auto}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(23,59,87,.08);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em}.header-logos{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}.brand-logo{display:block;width:auto;height:auto;max-height:48px;object-fit:contain}.left-logo{max-width:230px}.right-logo{max-width:190px}.nav{display:flex;align-items:center;gap:28px;color:#587080;font-size:14px}.nav a:hover{color:var(--ink)}.nav-cta{padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff!important;font-weight:650}.hero{padding:76px 0 58px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#f6f8fa 100%)}.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:40px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.14em;color:var(--teal);text-transform:uppercase;display:flex;align-items:center;gap:9px}.eyebrow:before{content:"";width:24px;height:2px;background:var(--teal)}h1{margin:17px 0 0;font-size:clamp(38px,5vw,60px);line-height:1.12;letter-spacing:-.055em;color:var(--ink);max-width:600px}.title-accent{color:var(--teal)}.hero-art{height:330px;position:relative;display:grid;place-items:center}.art-glow{position:absolute;width:270px;height:270px;border-radius:50%;background:radial-gradient(circle,#d9f1ed 0%,#e9f4f7 48%,rgba(234,244,245,0) 72%)}.art-ring{position:absolute;border:1px solid rgba(49,167,160,.27);border-radius:50%;width:290px;height:290px}.art-ring.r2{width:220px;height:220px;border-color:rgba(23,59,87,.12)}.art-ring.r3{width:350px;height:350px;border-style:dashed;border-color:rgba(23,59,87,.11)}.core-card{position:relative;width:190px;height:190px;background:linear-gradient(145deg,#173b57,#28667b);border-radius:32px;box-shadow:0 24px 50px rgba(23,59,87,.22);display:flex;align-items:center;justify-content:center;transform:rotate(-5deg)}.core-card:before,.core-card:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.2);border-radius:50%;width:125px;height:125px}.core-card:after{width:74px;height:74px;border-color:rgba(255,255,255,.32)}.core-symbol{font-size:51px;color:#fff;z-index:1;font-weight:300}.node{position:absolute;width:52px;height:52px;border-radius:17px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:21px;color:var(--ink)}.node.n1{top:29px;right:55px;background:#fff4cd}.node.n2{bottom:25px;left:41px;background:#e2f5f0}.node.n3{top:85px;left:0;background:#eaf1fb}.node.n4{bottom:45px;right:8px;background:#fceee2}.orbit-line{position:absolute;width:1px;height:80px;background:rgba(23,59,87,.16);transform:rotate(44deg);top:75px;right:94px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 24px}.section-kicker{color:var(--teal);font-weight:750;font-size:12px;letter-spacing:.11em}.section-head h2{margin:5px 0 0;font-size:28px;letter-spacing:-.04em}.section-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:9px 13px;border-radius:10px;font-size:13px;font-weight:650;cursor:pointer;transition:all .15s}.filter:hover{border-color:var(--ink2)}.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}.lesson-section{padding:14px 0 78px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;min-width:0;display:flex;flex-direction:column}.card:hover{transform:translateY(-4px);border-color:#b6d9d8;box-shadow:var(--shadow)}.thumb{aspect-ratio:16 / 9;min-height:156px;position:relative;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#e8f2f8,#e1f2ef)}.thumb-art{width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(23,59,87,.08);display:grid;place-items:center;position:relative;z-index:1}.card-body{padding:16px 17px 17px;display:flex;flex-direction:column;flex:1}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.status{font-size:11px;border-radius:6px;padding:4px 8px;font-weight:700}.status.ready{background:#eaf4f5;color:var(--teal)}.status.pending{background:#f1f3f4;color:#7c8991}.video-card-button{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}.video-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.video-title{display:block;margin:0;color:var(--ink);font-size:15px;line-height:1.45;letter-spacing:-.02em;font-weight:700;word-break:keep-all}.card:hover .video-title,.video-card-button:focus-visible .video-title{color:var(--teal)}

.video-tag{display:inline-block;margin-top:6px;margin-bottom:8px;padding:3px 8px;font-size:11px;font-weight:700;border-radius:6px;line-height:1.3;width:fit-content}
.video-tag[data-cat="AI 기초"]{background:#e2f5f0;color:#1e7069}
.video-tag[data-cat="바이브코딩"]{background:#eaf1fb;color:#23528f}
.video-tag[data-cat="문서 작성"]{background:#fff4cd;color:#836709}
.video-tag[data-cat="영상 생성"]{background:#fceee2;color:#9c4b14}
.video-tag[data-cat="기타"]{background:#f0f2f4;color:#61707a}

.card-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eff1f2;padding-top:12px;margin-top:auto}.video-label{font-size:12px;color:#788892}.video-link{font-size:12px;font-weight:700;color:var(--teal);display:flex;gap:6px;align-items:center}.video-link.disabled{color:#91a0a9}.video-link .smallplay{font-size:10px}.focusable:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #f4c95d;outline-offset:3px}

.video-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.video-modal[aria-hidden="false"]{display:flex}
.modal-shade{position:absolute;inset:0;background:rgba(10,24,37,.78)}
.modal-panel{position:relative;z-index:1;width:min(100%,1040px);padding:16px;background:#fff;border:1px solid rgba(255,255,255,.55);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.32)}
.modal-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 12px}
.modal-title{margin:0;color:var(--ink);font-size:18px;line-height:1.4;font-weight:750}
.modal-close{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#f7f9fa;color:var(--ink);font-size:26px;line-height:1;cursor:pointer}
.modal-close:hover{background:#eaf2f5}
.player-wrap{position:relative;width:100%;aspect-ratio:16 / 9;overflow:hidden;background:#000;border-radius:12px}
.player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(max-width:850px){.hero{padding:56px 0 42px}.hero-grid{grid-template-columns:1fr .8fr;gap:10px}.hero-art{transform:scale(.84);transform-origin:center right}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{gap:16px}}
@media(max-width:600px){.video-modal{padding:12px}.modal-panel{padding:12px;border-radius:14px}.modal-header{margin-bottom:10px}.modal-title{font-size:15px}.modal-close{width:40px;height:40px}.wrap{width:calc(100% - 36px)}.topbar{height:64px}.brand-logo{max-width:160px;max-height:40px}.nav a:not(.nav-cta){display:none}.nav-cta{padding:9px 12px}.hero{padding:45px 0 28px}.hero-grid{grid-template-columns:1fr}.hero-copy{text-align:left}.hero-art{height:205px;transform:scale(.72);transform-origin:top center;margin:4px 0 -48px}.eyebrow{font-size:11px}h1{font-size:40px;max-width:420px}.lesson-section{padding-bottom:48px}.section-head{align-items:flex-start;gap:15px;flex-direction:column}.section-head h2{font-size:25px}.section-controls{width:100%}.filter{flex:1;text-align:center}.grid{grid-template-columns:1fr;gap:14px}.thumb{min-height:156px}.card-body{padding:15px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>

    { id: 'M21', tag: '바이브코딩', title: '내 웹앱 첫 화면 구성 다시 보기' },
    { id: 'M22', tag: '바이브코딩', title: '기존 앱을 유지하며 기능 요청하기' },
    { id: 'M23', tag: '바이브코딩', title: '키워드 분류의 정상·예외 입력 복습' },
    { id: 'M24', tag: '바이브코딩', title: '브라우저 저장과 새로고침 확인' },
    { id: 'M25', tag: '바이브코딩', title: 'AI 요약을 추가해도 기존 기능 지키기' },
    { id: 'M26', tag: '바이브코딩', title: '다른 사용자 관점에서 웹앱 사용 흐름 확인' },
    { id: 'M27', tag: '바이브코딩', title: '진짜 AI 결과·예시·오류 구분' },
    { id: 'M28', tag: '바이브코딩', title: '버그 재현과 회귀 검사' },
    { id: 'M29', tag: '바이브코딩', title: '반복작업을 작은 Task로 바꾸기' },
    { id: 'M30', tag: '바이브코딩', title: '자동화할 자료와 사람 검토 기준 정하기' },
    { id: 'M31', tag: '바이브코딩', title: 'Tasks·Skills·Schedules 다시 구분하기' },
    { id: 'M32', tag: '바이브코딩', title: '단건 실행·예외·예약을 구분하기' },
    { id: 'M33', tag: 'AI 기초', title: '변화카드에서 근거 검증까지의 성장 기록' },
    { id: 'M34', tag: '영상 생성', title: '대표 작품과 나의 기여 이야기하기' },
    { id: 'M35', tag: '바이브코딩', title: '웹앱·자동화 성취를 근거로 설명하기' },
    { id: 'M36', tag: 'AI 기초', title: '작품 공유의 개인정보·권리 최종 확인' }
  ];

  let displayItems = VIDEO_MAPPING.map(item => ({
    ...item,
    videoId: null,
    isReady: false
  }));

  const videoGrid = document.getElementById('videoGrid');
  const filterButtons = document.querySelectorAll('.filter');
  const modal = document.getElementById('videoModal');
  const modalShade = document.getElementById('modalShade');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const modalTitle = document.getElementById('modalVideoTitle');
  const playerFrame = document.getElementById('videoPlayerFrame');

  let currentCategory = 'all';

  function normalize(str) {
    return (str || '').replace(/[\s\-_:·()]/g, '').toLowerCase();
  }

  async function fetchPlaylistVideos() {
    const feedUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${PLAYLIST_ID}`;
    const proxyUrls = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`,
      `https://corsproxy.io/?url=${encodeURIComponent(feedUrl)}`
    ];

    let xmlText = null;
    for (const pUrl of proxyUrls) {
      try {
        const res = await fetch(pUrl, { cache: 'no-store' });
        if (res.ok) {
          xmlText = await res.text();
          if (xmlText && xmlText.includes('<feed')) break;
        }
      } catch (err) {}
    }

    if (!xmlText) return;

    try {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
      const entries = Array.from(xmlDoc.querySelectorAll('entry'));

      const fetchedList = entries.map(entry => {
        const videoId = entry.getElementsByTagName('yt:videoId')[0]?.textContent || '';
        const rawTitle = entry.getElementsByTagName('title')[0]?.textContent || '';
        return { videoId, rawTitle };
      }).filter(v => v.videoId);

      const unmappedFetched = [];

      fetchedList.forEach(ytVideo => {
        const ytNorm = normalize(ytVideo.rawTitle);
        let matched = false;

        for (const item of displayItems) {
          const idNorm = normalize(item.id);
          const titleNorm = normalize(item.title);

          if (ytNorm.includes(idNorm) || ytNorm.includes(titleNorm) || titleNorm.includes(ytNorm)) {
            item.videoId = ytVideo.videoId;
            item.isReady = true;
            matched = true;
            break;
          }
        }

        if (!matched) {
          unmappedFetched.push(ytVideo);
        }
      });

      unmappedFetched.forEach((extra, idx) => {
        displayItems.push({
          id: `추가-${idx + 1}`,
          tag: '기타',
          title: extra.rawTitle,
          videoId: extra.videoId,
          isReady: true
        });
      });

      renderCards();
    } catch (e) {
      console.error('재생목록 로드 중 오류 발생:', e);
    }
  }

  function renderCards() {
    videoGrid.innerHTML = '';

    const filtered = displayItems.filter(item => {
      if (currentCategory === 'all') return true;
      return item.tag === currentCategory;
    });

    if (filtered.length === 0) {
      videoGrid.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#6e7e89;">해당 분류의 영상이 없습니다.</div>';
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';

      const thumbHtml = item.isReady
        ? `<div class="thumb">
             <img class="video-thumb" src="https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg" alt="${item.title}" loading="lazy">
           </div>`
        : `<div class="thumb">
             <div class="thumb-art"><span style="font-size:24px;color:var(--ink);">${item.id}</span></div>
           </div>`;

      const statusBadge = item.isReady
        ? `<span class="status ready">학습 가능</span>`
        : `<span class="status pending">업로드 대기</span>`;

      const actionBtn = item.isReady
        ? `<button type="button" class="video-card-button" data-video-id="${item.videoId}" data-title="${item.title}">
             ${thumbHtml}
             <div class="card-body">
               <div class="card-top">
                 ${statusBadge}
                 <span class="video-label">${item.id}</span>
               </div>
               <h3 class="video-title">${item.title}</h3>
               <span class="video-tag" data-cat="${item.tag}">[${item.tag}]</span>
               <div class="card-bottom">
                 <span class="video-label">마이크로러닝</span>
                 <span class="video-link">시청하기 <span class="smallplay">▶</span></span>
               </div>
             </div>
           </button>`
        : `<div>
             ${thumbHtml}
             <div class="card-body">
               <div class="card-top">
                 ${statusBadge}
                 <span class="video-label">${item.id}</span>
               </div>
               <h3 class="video-title">${item.title}</h3>
               <span class="video-tag" data-cat="${item.tag}">[${item.tag}]</span>
               <div class="card-bottom">
                 <span class="video-label">업로드 예정</span>
                 <span class="video-link disabled">준비중</span>
               </div>
             </div>
           </div>`;

      card.innerHTML = actionBtn;
      videoGrid.appendChild(card);
    });

    document.querySelectorAll('.video-card-button').forEach(btn => {
      btn.addEventListener('click', () => {
        const vId = btn.getAttribute('data-video-id');
        const vTitle = btn.getAttribute('data-title');
        openPlayer(vId, vTitle);
      });
    });
  }

  function openPlayer(videoId, title) {
    modalTitle.textContent = title;
    playerFrame.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closePlayer() {
    playerFrame.src = '';
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  modalCloseBtn.addEventListener('click', closePlayer);
  modalShade.addEventListener('click', closePlayer);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.getAttribute('aria-hidden') === 'false') {
      closePlayer();
    }
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.getAttribute('data-filter');
      renderCards();
    });
  });

  renderCards();
  fetchPlaylistVideos();
})();
</script>
