<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b57">
<title>2026 생성형 AI 및 바이브 코딩 활용 연수 사전 학습 영상</title>
<style>
:root{--ink:#173b57;--ink2:#284d66;--teal:#31a7a0;--gold:#f4c95d;--paper:#f6f8fa;--white:#fff;--line:#e2e9ee;--muted:#6e7e89;--soft:#eaf4f5;--shadow:0 10px 32px rgba(23,59,87,.08);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Malgun Gothic",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:calc(100% - 48px);max-width:1680px;margin:auto}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(23,59,87,.08);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.brand-logo{display:block;width:auto;height:auto;max-height:48px;object-fit:contain}.left-logo{max-width:230px}.right-logo{max-width:190px}.header-logos{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}

.user-bar{display:flex;justify-content:flex-end;padding:10px 0 0}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid rgba(49,167,160,.3);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s}
.user-badge:hover{background:#dcedef;border-color:var(--teal)}
.user-badge-icon{font-size:11px;color:var(--teal)}

.hero{padding:46px 0 58px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#f6f8fa 100%)}.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:40px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.14em;color:var(--teal);text-transform:uppercase;display:flex;align-items:center;gap:9px}.eyebrow:before{content:"";width:24px;height:2px;background:var(--teal)}h1{margin:17px 0 0;font-size:clamp(34px,4.5vw,54px);line-height:1.2;letter-spacing:-.04em;color:var(--ink);max-width:680px;word-break:keep-all}.hero-art{height:330px;position:relative;display:grid;place-items:center}.art-glow{position:absolute;width:270px;height:270px;border-radius:50%;background:radial-gradient(circle,#d9f1ed 0%,#e9f4f7 48%,rgba(234,244,245,0) 72%)}.art-ring{position:absolute;border:1px solid rgba(49,167,160,.27);border-radius:50%;width:290px;height:290px}.art-ring.r2{width:220px;height:220px;border-color:rgba(23,59,87,.12)}.art-ring.r3{width:350px;height:350px;border-style:dashed;border-color:rgba(23,59,87,.11)}.core-card{position:relative;width:190px;height:190px;background:linear-gradient(145deg,#173b57,#28667b);border-radius:32px;box-shadow:0 24px 50px rgba(23,59,87,.22);display:flex;align-items:center;justify-content:center;transform:rotate(-5deg)}.core-card:before,.core-card:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.2);border-radius:50%;width:125px;height:125px}.core-card:after{width:74px;height:74px;border-color:rgba(255,255,255,.32)}.core-symbol{font-size:51px;color:#fff;z-index:1;font-weight:300}.node{position:absolute;width:52px;height:52px;border-radius:17px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:21px;color:var(--ink)}.node.n1{top:29px;right:55px;background:#fff4cd}.node.n2{bottom:25px;left:41px;background:#e2f5f0}.node.n3{top:85px;left:0;background:#eaf1fb}.node.n4{bottom:45px;right:8px;background:#fceee2}.orbit-line{position:absolute;width:1px;height:80px;background:rgba(23,59,87,.16);transform:rotate(44deg);top:75px;right:94px}

.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 24px;gap:20px;flex-wrap:wrap}
.section-kicker{color:var(--teal);font-weight:750;font-size:12px;letter-spacing:.11em}
.section-head h2{margin:5px 0 0;font-size:28px;letter-spacing:-.04em}

.section-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.diff-btn-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:9px 13px;border-radius:10px;font-size:13px;font-weight:650;cursor:pointer;transition:all .15s}
.filter:hover{border-color:var(--ink2)}
.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}

.cat-select-wrap{display:flex;align-items:center}
.category-select{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:650;cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s}
.category-select:hover,.category-select:focus{border-color:var(--ink2)}

.lesson-section{padding:14px 0 78px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;min-width:0;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:#b6d9d8;box-shadow:var(--shadow)}
.thumb{aspect-ratio:16 / 9;min-height:156px;position:relative;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#e8f2f8,#e1f2ef)}
.thumb-art{width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(23,59,87,.08);display:grid;place-items:center;position:relative;z-index:1}
.card-body{padding:16px 17px 17px;display:flex;flex-direction:column;flex:1}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.status{font-size:11px;border-radius:6px;padding:4px 8px;font-weight:700}
.status.ready{background:#eaf4f5;color:var(--teal)}
.status.pending{background:#f1f3f4;color:#7c8991}
.video-card-button{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}
.video-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}
.video-title{display:block;margin:0;color:var(--ink);font-size:15px;line-height:1.45;letter-spacing:-.02em;font-weight:700;word-break:keep-all}
.card:hover .video-title,.video-card-button:focus-visible .video-title{color:var(--teal)}

.video-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;margin-bottom:10px}
.video-tag{display:inline-block;padding:3px 8px;font-size:11px;font-weight:700;border-radius:6px;line-height:1.3;width:fit-content}
.video-tag[data-cat="AI 일반"]{background:#e2f5f0;color:#1e7069}
.video-tag[data-cat="AI 기초"]{background:#e2f5f0;color:#1e7069}
.video-tag[data-cat="바이브코딩"]{background:#eaf1fb;color:#23528f}
.video-tag[data-cat="문서 작성"]{background:#fff4cd;color:#836709}
.video-tag[data-cat="영상 생성"]{background:#fceee2;color:#9c4b14}
.video-tag[data-cat="기타"]{background:#f0f2f4;color:#61707a}

.video-tag[data-diff="AI 시작하기"]{background:#e8f5e9;color:#2e7d32;border:1px solid rgba(46,125,50,.2)}
.video-tag[data-diff="AI 이해하기"]{background:#e3f2fd;color:#1565c0;border:1px solid rgba(21,101,192,.2)}
.video-tag[data-diff="AI 심화과정"]{background:#f3e5f5;color:#7b1fa2;border:1px solid rgba(123,31,162,.2)}

.card-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eff1f2;padding-top:12px;margin-top:auto}
.video-label{font-size:12px;color:#788892}
.video-link{font-size:12px;font-weight:700;color:var(--teal);display:flex;gap:6px;align-items:center}
.video-link.disabled{color:#91a0a9}
.video-link .smallplay{font-size:10px}
.focusable:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #f4c95d;outline-offset:3px}

.video-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.video-modal[aria-hidden="false"]{display:flex}
.modal-shade{position:absolute;inset:0;background:rgba(10,24,37,.78)}
.modal-panel{position:relative;z-index:1;width:min(100%,1040px);padding:16px;background:#fff;border:1px solid rgba(255,255,255,.55);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.32)}
.modal-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 12px}
.modal-title{margin:0;color:var(--ink);font-size:18px;line-height:1.4;font-weight:750}
.modal-close{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#f7f9fa;color:var(--ink);font-size:26px;line-height:1;cursor:pointer}
.modal-close:hover{background:#eaf2f5}
.player-wrap{position:relative;width:100%;aspect-ratio:16 / 9;overflow:hidden;background:#000;border-radius:12px}
.player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.name-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.name-modal[aria-hidden="false"]{display:flex}
.name-panel{position:relative;z-index:1;width:min(100%,430px);padding:24px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(23,59,87,.2)}
.name-panel h3{margin:0 0 8px;font-size:19px;font-weight:750;color:var(--ink)}
.name-panel p{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.45}
.name-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--ink);outline:none;transition:border-color .2s}
.name-input:focus{border-color:var(--teal)}
.name-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.name-btn{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:0}
.name-btn.primary{background:var(--ink);color:#fff}
.name-btn.primary:hover{background:var(--ink2)}
.name-btn.cancel{background:#f1f3f4;color:var(--muted)}
.name-btn.cancel:hover{background:#e2e9ee}

@media(max-width:850px){.hero{padding:40px 0 42px}.hero-grid{grid-template-columns:1fr .8fr;gap:10px}.hero-art{transform:scale(.84);transform-origin:center right}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.video-modal,.name-modal{padding:12px}.modal-panel{padding:12px;border-radius:14px}.name-panel{padding:18px;border-radius:14px}.modal-header{margin-bottom:10px}.modal-title{font-size:15px}.modal-close{width:40px;height:40px}.wrap{width:calc(100% - 36px)}.topbar{height:64px}.brand-logo{max-width:160px;max-height:40px}.hero{padding:30px 0 28px}.hero-grid{grid-template-columns:1fr}.hero-copy{text-align:left}.hero-art{height:205px;transform:scale(.72);transform-origin:top center;margin:4px 0 -48px}.eyebrow{font-size:11px}h1{font-size:30px}.lesson-section{padding-bottom:48px}.section-head{align-items:flex-start;gap:15px;flex-direction:column}.section-head h2{font-size:25px}.section-controls{width:100%;flex-direction:column;align-items:stretch;gap:10px}.diff-btn-group{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%}.filter{flex:1;text-align:center}.category-select{width:100%}.grid{grid-template-columns:1fr;gap:14px}.thumb{min-height:156px}.card-body{padding:15px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>
</head>

  </div>
</header>

<div class="wrap user-bar">
  <button type="button" class="user-badge" id="userBadgeBtn">
    <span id="userBadgeText">로그인해 주세요</span>
    <span class="user
