rgba(23,59,87,.22);display:flex;align-items:center;justify-content:center;transform:rotate(-5deg)}.core-card:before,.core-card:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.2);border-radius:50%;width:125px;height:125px}.core-card:after{width:74px;height:74px;border-color:rgba(255,255,255,.32)}.core-symbol{font-size:51px;color:#fff;z-index:1;font-weight:300}.node{position:absolute;width:52px;height:52px;border-radius:17px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:21px;color:var(--ink)}.node.n1{top:29px;right:55px;background:#fff4cd}.node.n2{bottom:25px;left:41px;background:#e2f5f0}.node.n3{top:85px;left:0;background:#eaf1fb}.node.n4{bottom:45px;right:8px;background:#fceee2}.orbit-line{position:absolute;width:1px;height:80px;background:rgba(23,59,87,.16);transform:rotate(44deg);top:75px;right:94px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 24px}.section-kicker{color:var(--teal);font-weight:750;font-size:12px;letter-spacing:.11em}.section-head h2{margin:5px 0 0;font-size:28px;letter-spacing:-.04em}.section-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:9px 13px;border-radius:10px;font-size:13px;font-weight:650;cursor:pointer;transition:all .15s}.filter:hover{border-color:var(--ink2)}.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}.lesson-section{padding:14px 0 78px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;min-width:0;display:flex;flex-direction:column}.card:hover{transform:translateY(-4px);border-color:#b6d9d8;box-shadow:var(--shadow)}.thumb{aspect-ratio:16 / 9;min-height:156px;position:relative;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#e8f2f8,#e1f2ef)}.thumb-art{width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(23,59,87,.08);display:grid;place-items:center;position:relative;z-index:1}.card-body{padding:16px 17px 17px;display:flex;flex-direction:column;flex:1}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.status{font-size:11px;border-radius:6px;padding:4px 8px;font-weight:700}.status.ready{background:#eaf4f5;color:var(--teal)}.status.pending{background:#f1f3f4;color:#7c8991}.video-card-button{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}.video-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.video-title{display:block;margin:0;color:var(--ink);font-size:15px;line-height:1.45;letter-spacing:-.02em;font-weight:700;word-break:keep-all}.card:hover .video-title,.video-card-button:focus-visible .video-title{color:var(--teal)}

.video-tag{display:inline-block;margin-top:6px;margin-bottom:8px;padding:3px 8px;font-size:11px;font-weight:700;border-radius:6px;line-height:1.3;width:fit-content}

@media(max-width:850px){.hero{padding:56px 0 42px}.hero-grid{grid-template-columns:1fr .8fr;gap:10px}.hero-art{transform:scale(.84);transform-origin:center right}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}

<script>
(() => {
  const PLAYLIST_ID = 'PLCz2U1aQpJsI';

  const VIDEO_MAPPING = [
    { id: 'M01', tag: 'AI 기초', title: 'AI와 나누는 첫 업무 대화: 질문의 맥락과 방향 설정' },
    { id: 'M02', tag: 'AI 기초', title: '실습 자료와 데이터 준비: AI에게 넘겨줄 자료 정돈하기' },
    { id: 'M03', tag: 'AI 기초', title: '나의 변화목표 한 문장으로 읽기' },
    { id: 'M04', tag: 'AI 기초', title: '첫 AI 요청·응답과 개인정보 점검' },
    { id: 'M05', tag: 'AI 기초', title: 'WHAT·WHO·HOW·LOOK·Task·Context' },
    { id: 'M06', tag: 'AI 기초', title: '요청 하나만 바꾸어 결과 비교하기' },
    { id: 'M07', tag: 'AI 기초', title: '내 과제에 참고자료 연결하기' },
    { id: 'M08', tag: 'AI 기초', title: '출처와 미확정 정보를 평가하기' },
    { id: 'M09', tag: '문서 작성', title: '개인 목적에서 제작 조건 추출하기' },
    { id: 'M10', tag: '문서 작성', title: '재사용 프롬프트 실제 입력하기' },
    { id: 'M11', tag: '문서 작성', title: '첫 제작본을 수정 전에 읽는 법' },
    { id: 'M12', tag: '문서 작성', title: '수정 시 원자료·원본 대조하기' },
    { id: 'M13', tag: '문서 작성', title: '유지조건과 변경조건 분리 복습' },
    { id: 'M14', tag: '문서 작성', title: '문서의 사실이 바뀌지 않았는지 확인' },
    { id: 'M15', tag: '영상 생성', title: '이미지의 구도·스타일 유지 확인' },
    { id: 'M16', tag: '문서 작성', title: '문서·문항 검수기록 읽기' },
    { id: 'M17', tag: '영상 생성', title: '스토리보드와 영상 소재 확인' },
    { id: 'M18', tag: '문서 작성', title: '최종 작품 공유 전 점검' },
    { id: 'M19', tag: '바이브코딩', title: '내가 반복했던 일 찾아내기' },
    { id: 'M20', tag: '바이브코딩', title: '자연어로 웹앱 요구사항 설계하기' },
    { id: 'M21', tag: '바이브코딩', title: '내 웹앱 첫 화면 구성 다시 보기' },
    { id: 'M22', tag: '바이브코딩', title: '기존 앱을 유지하며 기능 요청하기' },
    { id: 'M23', tag: '바이브코딩', title: '키워드 분류의 정상·예외 입력 복습' },
    { id: 'M24', tag: '바이브코딩', title: '브라우저 저장과 새로고침 확인' },
    { id: 'M25', tag: '바이브코딩', title: 'AI 요약을 추가해도 기존 기능 지키기' },
    { id: 'M26', tag: '바이브코딩', title: '다른 사용자 관점에서 웹앱 사용 흐름 확인' },
    { id: 'M27', tag: '바이브코딩', title: '진짜 AI 결과·예시·오류 구분' },
    { id: 'M28', tag: '바이브코딩', title: '버그 재현과 회귀 검사' },
    { id: 'M29', tag: '바이브코딩', title: '반복작업을 작은 Task로 바꾸기' },
    { id: 'M30', tag: '바이브코딩', title: '자동화할 자료와 사람 검토 기준 정하기' },
    { id: 'M31', tag: '바이브코딩', title: 'Tasks·Skills·Schedules 다시 구분하기' },
    { id: 'M32', tag: '바이브코딩', title: '단건 실행·예외·예약을 구분하기' },
    { id: 'M33', tag: 'AI 기초', title: '변화카드에서 근거 검증까지의 성장 기록' },
    { id: 'M34', tag: '영상 생성', title: '대표 작품과 나의 기여 이야기하기' },
    { id: 'M35', tag: '바이브코딩', title: '웹앱·자동화 성취를 근거로 설명하기' },
    { id: 'M36', tag: 'AI 기초', title: '작품 공유의 개인정보·권리 최종 확인' }
  ];

  let displayItems = VIDEO_MAPPING.map((item, idx) => ({
    ...item,
    playlistIndex: idx,
    videoId: null,
    isReady: false
  }));

  const videoGrid = document.getElementById('videoGrid');
  const filterButtons = document.querySelectorAll('.filter');
  const modal = document.getElementById('videoModal');
  const modalShade = document.getElementById('modalShade');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const modalTitle = document.getElementById('modalVideoTitle');
  const playerFrame = document.getElementById('videoPlayerFrame');

  let currentCategory = 'all';

  function normalize(str) {
    return (str || '').replace(/[\s\-_:·()\[\]]/g, '').toLowerCase();
  }

  // XML 네임스페이스에 영향받지 않는 직접 추출기
  function parseXmlEntries(xmlString) {
    const entries = [];
    const entryMatches = xmlString.match(/<entry[\s\S]*?<\/entry>/gi) || [];

    for (const block of entryMatches) {
      const idMatch = block.match(/<yt:videoId>([^<]+)<\/yt:videoId>/i) ||
                      block.match(/<videoId>([^<]+)<\/videoId>/i);
      const titleMatch = block.match(/<title[^>]*>([\s\S]*?)<\/title>/i);

      if (idMatch && titleMatch) {
        const videoId = idMatch[1].trim();
        let rawTitle = titleMatch[1].trim();
        rawTitle = rawTitle.replace(/&amp;/g, '&')
                           .replace(/&lt;/g, '<')
                           .replace(/&gt;/g, '>')
                           .replace(/&quot;/g, '"')
                           .replace(/&#39;/g, "'");
        entries.push({ videoId, rawTitle });
      }
    }
    return entries;
  }

  // 유튜브 피드 조회
  async function fetchPlaylistVideos() {
    const feedUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${PLAYLIST_ID}`;
    const proxyUrls = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(feedUrl)}`
    ];

    let xmlText = null;
    for (const pUrl of proxyUrls) {
      try {
        const res = await fetch(pUrl, { cache: 'no-store' });
        if (res.ok) {
          const body = await res.text();
          if (body && body.includes('<entry')) {
            xmlText = body;
            break;
          }
        }
      } catch (err) {}
    }

    if (!xmlText) {
      // 프록시 통신 실패 시 재생목록 인덱스 직결 모드로 즉시 전환
      activatePlaylistFallback();
      return;
    }

    const fetchedList = parseXmlEntries(xmlText);
    if (fetchedList.length === 0) {
      activatePlaylistFallback();
      return;
    }

    const unmapped = [];

    fetchedList.forEach((ytVideo, ytIdx) => {
      const ytNorm = normalize(ytVideo.rawTitle);
      let matched = false;

      for (const item of displayItems) {
        const idNorm = normalize(item.id);
        const titleNorm = normalize(item.title);
        const numOnly = item.id.replace(/\D/g, '');
        const intNum = parseInt(numOnly, 10).toString();

        if (
          ytNorm.includes(idNorm) ||
          ytNorm.includes(`m${intNum}`) ||
          ytNorm.includes(`${numOnly}강`) ||
          ytNorm.includes(`${intNum}강`) ||
          ytNorm.includes(titleNorm) ||
          titleNorm.includes(ytNorm)
        ) {
          item.videoId = ytVideo.videoId;
          item.isReady = true;
          matched = true;
          break;
        }
      }

      if (!matched) {
        unmapped.push(ytVideo);
      }
    });

    unmapped.forEach((extra, idx) => {
      displayItems.push({
        id: `추가-${idx + 1}`,
        tag: '기타',
        title: extra.rawTitle,
        videoId: extra.videoId,
        isReady: true,
        playlistIndex: displayItems.length
      });
    });

    renderCards();
  }

  // 통신 차단 환경 대비 재생목록 순번 연결
  function activatePlaylistFallback() {
    displayItems.forEach((item, idx) => {
      item.isReady = true;
      item.fallbackIndex = idx;
    });
    renderCards();
  }

  function renderCards() {
    videoGrid.innerHTML = '';

    const filtered = displayItems.filter(item => {
      if (currentCategory === 'all') return true;
      return item.tag === currentCategory;
    });

    if (filtered.length === 0) {
      videoGrid.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#6e7e89;">해당 분류의 영상이 없습니다.</div>';
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';

      const thumbHtml = item.videoId
        ? `<div class="thumb">
             <img class="video-thumb" src="https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg" alt="${item.title}" loading="lazy">
           </div>`
        : `<div class="thumb">
             <div class="thumb-art"><span style="font-size:24px;color:var(--ink);">${item.id}</span></div>
           </div>`;

      const statusBadge = item.isReady
        ? `<span class="status ready">학습 가능</span>`
        : `<span class="status pending">업로드 대기</span>`;

      const actionBtn = item.isReady
        ? `<button type="button" class="video-card-button" data-video-id="${item.videoId || ''}" data-index="${item.fallbackIndex !== undefined ? item.fallbackIndex : ''}" data-title="${item.title}">
             ${thumbHtml}
             <div class="card-body">
               <div class="card-top">
                 ${statusBadge}
                 <span class="video-label">${item.id}</span>
               </div>
               <h3 class="video-title">${item.title}</h3>
               <span class="video-tag" data-cat="${item.tag}">[${item.tag}]</span>
               <div class="card-bottom">
                 <span class="video-label">마이크로러닝</span>
                 <span class="video-link">시청하기 <span class="smallplay">▶</span></span>
               </div>
             </div>
           </button>`
        : `<div>
             ${thumbHtml}
             <div class="card-body">
               <div class="card-top">
                 ${statusBadge}
                 <span class="video-label">${item.id}</span>
               </div>
               <h3 class="video-title">${item.title}</h3>
               <span class="video-tag" data-cat="${item.tag}">[${item.tag}]</span>
               <div class="card-bottom">
                 <span class="video-label">업로드 예정</span>
                 <span class="video-link disabled">준비중</span>
               </div>
             </div>
           </div>`;

      card.innerHTML = actionBtn;
      videoGrid.appendChild(card);
    });

    document.querySelectorAll('.video-card-button').forEach(btn => {
      btn.addEventListener('click', () => {
        const vId = btn.getAttribute('data-video-id');
        const vIdx = btn.getAttribute('data-index');
        const vTitle = btn.getAttribute('data-title');
        openPlayer(vId, vIdx, vTitle);
      });
    });
  }

  function openPlayer(videoId, fallbackIndex, title) {
    modalTitle.textContent = title;
    if (videoId) {
      playerFrame.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
    } else if (fallbackIndex !== '') {
      playerFrame.src = `https://www.youtube-nocookie.com/embed?listType=playlist&list=${PLAYLIST_ID}&index=${fallbackIndex}&autoplay=1`;
    } else {
      playerFrame.src = `https://www.youtube-nocookie.com/embed?listType=playlist&list=${PLAYLIST_ID}&autoplay=1`;
    }
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closePlayer() {
    playerFrame.src = '';
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  modalCloseBtn.addEventListener('click', closePlayer);
  modalShade.addEventListener('click', closePlayer);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.getAttribute('aria-hidden') === 'false') {
      closePlayer();
    }
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.getAttribute('data-filter');
      renderCards();
    });
  });

  renderCards();
  fetchPlaylistVideos();
})();
</script>
</body>
</html>
